<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <title>Edit Product</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="mt-4">Edit Product</h2>
    <form th:action="@{/products/edit}" th:object="${product}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}"> <div class="mb-3">
        <label class="form-label">Name:</label>
        <input type="text" th:field="*{name}" class="form-control">
        <div class="alert alert-warning mt-2" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>

        <div class="mb-3">
            <label class="form-label">Price:</label>
            <input type="number" th:field="*{price}" class="form-control">
            <div class="alert alert-warning mt-2" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <div class="mb-3">
            <p>Current Image: <span th:text="${product.image}"></span></p>
            <label class="form-label">Change Image (Optional):</label>
            <input type="file" name="imageProduct" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Category:</label>
            <select name="categoryId" class="form-control">
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"
                        th:selected="${cat.id == product.category?.id}"> </option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Update Product</button>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>QUẢN LÝ DANH MỤC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-sm bg-dark navbar-dark mb-4 shadow">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/products}">J2EE SHOP</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/products}">Sản phẩm</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/categories}">Danh mục</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0 fw-bold text-white">DANH MỤC SẢN PHẨM</h4>
            <a th:href="@{/categories/add}" class="btn btn-primary btn-sm">+ Thêm danh mục</a>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th class="ps-3">ID</th>
                    <th>Tên danh mục</th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${categories}">
                    <td class="ps-3" th:text="${c.id}"></td>
                    <td class="fw-bold" th:text="${c.name}"></td>
                    <td class="text-center">
                        <a th:href="@{/categories/delete/{id}(id=${c.id})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa?')">Xóa</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>QUẢN LÝ SẢN PHẨM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-sm bg-dark navbar-dark mb-4 shadow">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/products}">J2EE SHOP</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link active" th:href="@{/products}">Sản phẩm</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/categories}">Danh mục</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom">
            <h4 class="mb-0 text-dark fw-bold">DANH MỤC SẢN PHẨM </h4>
            <a th:href="@{/products/add}" class="btn btn-primary shadow-sm">+ Thêm mới</a>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th class="ps-3">ID</th>
                    <th>Tên sản phẩm</th>
                    <th>Hình ảnh</th>
                    <th>Giá bán</th>
                    <th class="text-center">Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td class="ps-3" th:text="${p.id}"></td>
                    <td class="fw-bold" th:text="${p.name}"></td>
                    <td>
                        <div class="d-flex align-items-center justify-content-center" style="width: 120px; height: 90px; overflow: hidden; border-radius: 8px;">
                            <img th:src="${p.image}"
                                 class="img-fluid border shadow-sm"
                                 style="width: 100%; height: 100%; object-fit: contain; background-color: #f8f9fa;"
                                 onerror="this.src='https://via.placeholder.com/120x90?text=No+Image'">
                        </div>
                    </td>
                    <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td class="text-center">
                        <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-warning">Sửa</a>
                        <a th:href="@{/products/delete/{id}(id=${p.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Xác nhận xóa?')">Xóa</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer class="text-center py-4 mt-5 border-top text-muted">
    <p>&copy; 2026 - Phát triển bởi Trung Kiên </p>
</footer>
</body>
</html>

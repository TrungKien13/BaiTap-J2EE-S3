<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý học phần - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Danh sách quản lý học phần</h2>
        <a href="/home" class="btn btn-secondary btn-sm">Quay lại Trang chủ</a>
    </div>

    <a th:href="@{/admin/courses/add}" class="btn btn-primary mb-3">+ Thêm học phần mới</a>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-hover border">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên học phần</th>
                    <th>Tín chỉ</th>
                    <th>Giảng viên</th>
                    <th class="text-center">Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="course : ${listCourses}">
                    <td th:text="${course.id}"></td>
                    <td th:text="${course.name}" class="fw-bold"></td>
                    <td th:text="${course.credits}"></td>
                    <td th:text="${course.lecturer}"></td>
                    <td class="text-center">
                        <a th:href="@{'/admin/courses/edit/' + ${course.id}}"
                           class="btn btn-warning btn-sm">Sửa</a>

                        <a th:href="@{'/admin/courses/delete/' + ${course.id}}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa học phần này?')">Xóa</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ - Đăng ký học phần</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/home">Course Registration</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/home">Trang chủ</a></li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-warning fw-bold" href="/admin/courses">QUẢN LÝ HỌC PHẦN</a>
                </li>
            </ul>
            <div class="d-flex text-white align-items-center">
                <div sec:authorize="isAuthenticated()">
                    <span class="me-3">Xin chào, <span sec:authentication="name"></span></span>
                    <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Đăng xuất</a>
                </div>
                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="btn btn-primary btn-sm me-2">Đăng nhập</a>
                    <a th:href="@{/register}" class="btn btn-outline-light btn-sm">Đăng ký</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="text-center mb-4">Danh sách học phần hiện có</h2>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="course : ${listCourses}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title text-primary" th:text="${course.name}"></h5>
                    <p class="card-text">
                        <strong>Tín chỉ:</strong> <span th:text="${course.credits}"></span><br>
                        <strong>Giảng viên:</strong> <span th:text="${course.lecturer}"></span>
                    </p>
                </div>
                <div class="card-footer bg-white border-0 pb-3">
                    <a th:href="@{'/enroll/' + ${course.id}}"
                       class="btn btn-success w-100"
                       sec:authorize="hasRole('STUDENT')">Đăng ký học môn này</a>

                    <a th:href="@{'/admin/courses/edit/' + ${course.id}}"
                       class="btn btn-outline-warning w-100"
                       sec:authorize="hasRole('ADMIN')">Sửa nhanh</a>
                </div>
            </div>
        </div>
    </div>

    <nav class="mt-4" th:if="${totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}">
                <a class="page-link" th:href="@{/home(pageNo=${i})}" th:text="${i}"></a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm học phần mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="col-md-6 mx-auto card shadow p-4">
        <h3 class="text-center mb-4 text-primary">Thêm học phần mới</h3>
        <form th:action="@{/admin/courses/save}" th:object="${course}" method="post">
            <div class="mb-3">
                <label class="form-label">Tên học phần:</label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="Nhập tên môn học" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Số tín chỉ:</label>
                <input type="number" th:field="*{credits}" class="form-control" min="1" max="10" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Giảng viên:</label>
                <input type="text" th:field="*{lecturer}" class="form-control" placeholder="Tên thầy/cô" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Loại học phần:</label>
                <select th:field="*{category}" class="form-select">
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
            </div>
            <div class="d-flex justify-content-between">
                <button type="submit" class="btn btn-success">Lưu dữ liệu</button>
                <a href="/admin/courses" class="btn btn-secondary">Hủy bỏ</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
